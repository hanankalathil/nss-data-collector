<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSS Enrolment Portal | Review & Submit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark.css">
  <link rel="stylesheet" href="css/animation.css">
</head>
<body>
  <header class="top-nav">
    <div class="app-header-container">
      <div class="brand-wrapper">
        <div class="brand-logo-badge" aria-hidden="true">NSS</div>
        <div class="nss-brand-text">
          <h1>NSS Data Collector</h1>
          <span class="nss-brand-sub">National Service Scheme • Enrolment Portal</span>
        </div>
      </div>
    </div>
  </header>

  <main class="main-app-container">
    <section id="wizard-header" class="wizard-header-sticky" style="padding-bottom: 1rem;">
      <div class="wizard-info-row" style="margin-bottom: 0;">
        <h2 id="wizard-step-title" class="wizard-step-title" style="margin: 0;">Review Enrolment Data</h2>
      </div>
    </section>

    <form id="nss-main-form" class="glass-card" novalidate autocomplete="on">
      <div class="form-step active" data-step="5">
        <div class="form-section-header">
          <p>Please double-check all details before submitting to the NSS Google Form database.</p>
        </div>

        <div id="review-summary-container" class="review-summary-wrapper">
          <!-- Populated dynamically by js/submit.js -->
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap;">
          <button type="button" id="back-to-edit-btn" class="wizard-btn btn-secondary" style="padding: 1rem 2rem; font-size: 1.1rem; width: 100%; max-width: 200px; justify-content: center;" onclick="window.location.href='family.html'">
            <svg viewBox="0 0 24 24" class="btn-icon" style="margin-right: 8px;"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span>Previous</span>
          </button>
          <button type="button" id="final-submit-btn" class="wizard-btn btn-primary" style="padding: 1rem 3rem; font-size: 1.1rem; width: 100%; max-width: 360px; justify-content: center;">
            <span>Submit Application</span>
            <svg viewBox="0 0 24 24" class="btn-icon"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </form>
  </main>
  
  <!-- Success Modals -->
  <div id="success-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-success-title">
    <canvas id="confetti-canvas"></canvas>
    <div class="success-modal-card" style="background: #fff; border: 4px solid #000; box-shadow: 8px 8px 0 #000; border-radius: 0; padding: 2.5rem 2rem;">
      <div class="checkmark-badge-wrapper" style="width: 80px; height: 80px; margin: 0 auto 1.5rem auto; background: #cdff00; border: 4px solid #000; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 #000; border-radius: 0;">
        <svg viewBox="0 0 52 52" style="width: 50px; height: 50px; overflow: visible;">
          <path fill="none" stroke="#000" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" d="M12 26l10 10 20-20" />
        </svg>
      </div>
      <h3 id="modal-success-title" class="success-title">Enrolment Submitted!</h3>
      <p class="success-desc">Your NSS Student Registration has been successfully recorded.</p>
      <div class="success-receipt-box" style="background: #fff; border: 3px solid #000; box-shadow: 4px 4px 0 #000; border-radius: 0;">
        <div class="receipt-row">
          <span class="receipt-label">Applicant:</span>
          <span id="success-student-name" class="receipt-val">--</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">Class/Division:</span>
          <span id="success-class-info" class="receipt-val">--</span>
        </div>
      </div>
      <div class="success-actions">
        <button id="success-new-entry-btn" type="button" class="wizard-btn btn-primary">
          New Entry
        </button>
        <button id="success-home-btn" type="button" class="wizard-btn btn-secondary">
          Go Home
        </button>
      </div>
    </div>
  </div>

  <!-- Hidden Iframe & Form for Reliable Google Forms Submission -->
  <iframe name="hiddenConfirm" id="hiddenConfirm" style="display: none;"></iframe>
  <form id="hidden-gform" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSftpfMlvc2WZMsf4HfMzY7QBDWG0GlHHt03138JupTBDHf9_g/formResponse" method="POST" target="hiddenConfirm" style="display: none;">
  </form>

  <script src="js/aadhaar.js"></script>
  <script src="js/district.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/submit.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Specifically run renderReviewSummary on this page
      if (window.SubmitEngine && window.SubmitEngine.renderReviewSummary) {
        window.SubmitEngine.renderReviewSummary();
      }
    });
  </script>
</body>
</html>
